<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('algolingo:theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/themes.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <title>NOVA · AlgoLingo</title>
</head>
<body class="app-body">
  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
  <div class="app-shell">
    <aside id="sidebar-root" class="sidebar" aria-label="Primary navigation"></aside>
    <div class="app-main">
      <header id="topbar-root" class="topbar"></header>
      <main class="page-wrap page-width">
        <div class="page-header">
          <div>
            <p class="eyebrow">AlgoLingo</p>
            <h1 id="page-title" class="page-title">Loading…</h1>
            <p id="page-subtitle" class="page-subtitle">Preparing this page…</p>
          </div>
          <div id="page-actions" class="page-actions"></div>
        </div>
        <div id="page-content" class="page-grid" aria-live="polite"></div>
      </main>
    </div>
  </div>
  <div id="toast-root" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root" class="modal-root" aria-hidden="true"></div>
  <script type="module" src="../assets/js/nova.js"></script>
</body>
</html>
